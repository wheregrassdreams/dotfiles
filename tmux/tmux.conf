set -g prefix C-Space
# bind C-Space send-prefix

set -g mouse on

set -g history-limit 10000         # 增加 scrollback 缓存

# Unbind default keybindings
unbind C-b
unbind '"'
unbind %
unbind z
unbind '$'
unbind '&'
unbind "'"
unbind '('
unbind ')'
unbind ','
unbind '[' 
unbind ']'
unbind C-Up   
unbind C-Down 
unbind C-Left
unbind C-Right
unbind E

# Reload config
bind ',' run-shell 'tmux source-file ~/.tmux.conf \; display-message -d 800  " #[fg=white]   Config reloaded"'

# Select pane
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Rename window/session
bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"

# New window/session
bind n new-window
bind N new-session

# Layout
bind C-l select-layout -o                 # 在最近布局间切换
bind = select-layout even-horizontal      # 等分水平
bind + select-layout even-vertical        # 等分垂直
bind ] select-layout tiled                # 平铺

# Paste 
bind p choose-buffer

# Join pane
bind J choose-window "join-pane -h '%%'"
bind @ choose-tree   "join-pane -h -s '%%'"    # prefix + @

# Find window (fzf)
bind f display-popup -w 45% -h 60% -E "tmux list-windows -a -F '#{session_name}:#{window_index}:#{window_name}' | fzf --reverse --prompt='>' --info hidden | cut -d: -f1,2 | xargs -I {} tmux switch-client -t {}"

# List windows/sessions
# bind w choose-window
# bind s choose-session

# Full
bind Space resize-pane -Z

# Resizing
# 持续按住可连发
bind -r Up    resize-pane -U 3
bind -r Down  resize-pane -D 3
bind -r Left  resize-pane -L 3
bind -r Right resize-pane -R 3

# Close
bind x kill-pane
bind X kill-window
bind q kill-pane
bind Q kill-window

# VI style
setw -g mode-keys vi               # 复制模式按键改成 vi 风格
bind C-Space copy-mode
bind -T copy-mode-vi v      send -X begin-selection
# bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi y      send -X copy-selection
bind -T copy-mode-vi V      send -X select-line
bind -T copy-mode-vi C-v    send -X rectangle-toggle   # 可选：矩形选择

# bind -T copy-mode-vi Escape send -X cancel
# bind -T copy-mode-vi C-[    send -X cancel
bind -T copy-mode-vi q      send -X cancel

bind -T copy-mode-vi Escape if-shell -F '#{selection_active}' \
  'send -X clear-selection' \
  'send -X cancel'
bind -T copy-mode-vi C-[ if-shell -F '#{selection_active}' \
  'send -X clear-selection' \
  'send -X cancel'

# bind -T copy-mode-vi y      send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi y      send -X copy-pipe "pbcopy"
# bind -T copy-mode-vi y    send -X copy-pipe-and-cancel "xclip -selection clipboard" 
# bind -T copy-mode-vi y    send -X copy-pipe-and-cancel "wl-copy"

# 没用
# bind -T copy-mode-vi s capture-pane -JpS -5000 \| fzf --ansi --reverse --prompt="tmux> " \| xargs -I {} tmux send-keys "{}" Enter
bind -T copy-mode-vi / command-prompt -i -p "Search down" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "Search up" "send -X search-backward-incremental \"%%%\""
bind -T copy-mode-vi n      send -X search-again
bind -T copy-mode-vi N      send -X search-reverse

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
        | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l


