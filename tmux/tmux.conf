unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-a
unbind C-b
# bind C-Space send-prefix

set -g mouse on

set -g history-limit 10000         # 增加 scrollback 缓存

bind C-r run-shell 'tmux source-file ~/.tmux.conf \; display-message -d 800  " #[fg=#353535]#[bg=brightblack]▍#[fg=white]   #[bg=default]#[fg=white,bold] Config reloaded"'

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key | split-window -h
bind-key - split-window -v

# bind-key r rename-window
# bind-key R rename-session

bind-key r command-prompt -I "#W" "rename-window '%%'"
bind-key R command-prompt -I "#S" "rename-session '%%'"

bind-key n new-window
bind-key N new-session

bind-key f display-popup -w 80% -h 80% -E "tmux list-windows -F '#I:#W' | fzf --reverse --prompt='Switch to window> ' | cut -d: -f1 | xargs tmux select-window -t"

# Prefix + arrows for resizing
# 持续按住可连发
bind -r Up    resize-pane -U 3
bind -r Down  resize-pane -D 3
bind -r Left  resize-pane -L 3
bind -r Right resize-pane -R 3


setw -g mode-keys vi               # 复制模式按键改成 vi 风格
bind C-a copy-mode
# bind C-Space copy-mode
# 进入复制模式（和 Vim 的 <CS>[ 类似）
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v   send -X rectangle-toggle   # 可选：矩形选择
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-[ send -X cancel
# bind -T copy-mode-vi C-Space send -X cancel
# 可视化选中完后复制到系统剪贴板（macOS）
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

